# BuildStart.io customizations — layered on top of the official docker-compose.yml
# Loaded automatically by docker compose.

services:
  studio:
    # Expose Studio on host port 3030 by default (change using STUDIO_PORT env var)
    ports:
      - "${STUDIO_PORT:-3030}:3000"

  functions:
    environment:
      # ── BuildStart.io edge function secrets ──────────────────────────────────
      AI_GENERATE_URL: ${AI_GENERATE_URL}
      BOT_API_KEY: ${BOT_API_KEY}
      WAHA_BASE_URL: ${WAHA_BASE_URL}
      WAHA_API_KEY: ${WAHA_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      WEBHOOK_URL_OVERRIDE: "https://order-grove-mixer-proportion.trycloudflare.com/functions/v1/webhook-wsender-founders_campus"

  waha:
    container_name: waha
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WHATSAPP_HOOK_URL: http://supabase-envoy:8000/functions/v1/webhook-wsender-founders_campus
      WHATSAPP_HOOK_EVENTS: message,message.any,session.status,poll.vote,poll.vote.failed
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-founders_campus_waha_secret}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_ZIP_MEDIA: "true"
      WAHA_NOWEB_STORE: "true"
      WHATSAPP_FILES_FOLDER: /app/.sessions/whatsapp-files
      WHATSAPP_FILES_LIFETIME: "86400"
    volumes:
      - ./volumes/waha_sessions:/app/.sessions:rw

